# Per-PR verification: lint and hermetic tests.
# Runs make lint (swiftlint + swiftformat --lint) and make test on every
# pull request and on push to main. AX-dependent tests (make test-ax) are
# excluded because GitHub-hosted runners have no Accessibility grant.
#
# Runner is macos-latest, which resolves to macos-26 or newer. The package's
# macOS 26.0 deployment target needs at least the macOS 26 SDK (Xcode 26); an
# older image such as macos-15 defaults to Xcode 16 and cannot build it. A
# newer SDK builds an older deployment target fine, so tracking latest is safe
# and only a downgrade would break the build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default: deny all. The job grants only what it needs.
permissions: {}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      # Select the default Xcode symlink explicitly so a future image default
      # change surfaces here rather than as a confusing SDK error mid-build.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install swiftlint and swiftformat
        run: brew install swiftlint swiftformat

      - name: Lint
        run: make lint

      - name: Run hermetic tests
        run: make test
